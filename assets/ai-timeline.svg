  <circle cx="960.0" cy="182" r="6" fill="#0d1424" stroke="#7dd3fc" stroke-width="2"/>
  <text x="960.0" y="160" class="m" font-size="14" fill="#7dd3fc" text-anchor="middle">May 2026</text>
  <text x="960.0" y="218" class="t" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="middle">Codex</text>
  <text x="960.0" y="240" class="t" font-size="14" fill="#a8b3c4" text-anchor="middle">GPT-5.5 → 6.1</text>
  <circle cx="1104.0" cy="182" r="8" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="2"/>
  <text x="1104.0" y="160" class="m" font-size="14" fill="#7dd3fc" text-anchor="middle">Oct 2026</text>
  <text x="1104.0" y="218" class="t" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="middle">121B tokens</text>
  <text x="1104.0" y="240" class="t" font-size="14" fill="#a8b3c4" text-anchor="middle">in one month</text>

