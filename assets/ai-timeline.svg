  <circle cx="672.0" cy="182" r="6" fill="#0d1424" stroke="#7dd3fc" stroke-width="2"/>
  <text x="672.0" y="160" class="m" font-size="14" fill="#7dd3fc" text-anchor="middle">Jul 2025</text>
