<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Mert Batur Gürbüz — Co-Founder &amp; CTO at Techsy.io">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" x2="900">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#7dd3fc"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-400 0; 400 0; -400 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.3" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
      .rot { opacity: 0; animation: rot 16s infinite; }
      .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
      @keyframes rot {
        0%   { opacity: 0; transform: translateY(10px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        25%  { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; }
      }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridmask)" opacity="0.7"/>
    <circle cx="980" cy="80" r="150" fill="#0ea5e9" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="980;880;980" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="300" r="130" fill="#8b5cf6" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="1080;1000;1080" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="330" r="90" fill="#f97316" opacity="0.18" filter="url(#blur)">
      <animate attributeName="cy" values="330;280;330" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#1f2a3d"/>

  <!-- status pill -->
  <g transform="translate(60 52)">
    <rect width="272" height="32" rx="16" fill="#0f172a" stroke="#1e3a5f"/>
    <circle class="dot" cx="20" cy="16" r="5" fill="#22c55e"/>
    <text x="36" y="21" class="mono" font-size="13" fill="#94a3b8">open to collabs · Birmingham, UK</text>
  </g>

  <text x="58" y="160" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Mert Batur Gürbüz</text>

  <text x="60" y="204" class="sans" font-size="21" fill="#cbd5e1">
    Co-Founder &amp; CTO <tspan fill="#7dd3fc">@ Techsy.io</tspan>
    <tspan fill="#475569">  ·  </tspan>MEng Software Engineering <tspan fill="#a78bfa">@ UoB</tspan>
  </text>

  <!-- rotating line -->
  <g class="mono" font-size="18">
    <text x="60" y="262" fill="#64748b">~/mert<tspan fill="#22c55e"> ❯ </tspan></text>
    <text x="148" y="262" fill="#e2e8f0" class="rot r1">orchestrating multi-agent AI systems</text>
    <text x="148" y="262" fill="#e2e8f0" class="rot r2">shipping web, iOS &amp; Flutter apps</text>
    <text x="148" y="262" fill="#e2e8f0" class="rot r3">growing brands with SEO &amp; automated content</text>
    <text x="148" y="262" fill="#e2e8f0" class="rot r4">researching metacognitive LLM controllers</text>
  </g>

  <!-- tag chips -->
  <g class="mono" font-size="13" fill="#94a3b8">
    <g transform="translate(60 296)"><rect width="104" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">AI agents</text></g>
    <g transform="translate(174 296)"><rect width="112" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">full-stack</text></g>
    <g transform="translate(296 296)"><rect width="86" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">mobile</text></g>
    <g transform="translate(392 296)"><rect width="132" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">SEO &amp; growth</text></g>
    <g transform="translate(534 296)"><rect width="96" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">content</text></g>
    <g transform="translate(640 296)"><rect width="104" height="28" rx="8" fill="#0f172a" stroke="#1e293b"/><text x="14" y="19">game dev</text></g>
  </g>

  <!-- monogram -->
  <g transform="translate(1010 128)">
    <rect width="120" height="120" rx="28" fill="#0b1220" fill-opacity="0.75" stroke="#334155"/>
    <text x="60" y="78" text-anchor="middle" class="sans" font-size="46" font-weight="800" fill="url(#name)" letter-spacing="-1">MB</text>
  </g>
</svg>
