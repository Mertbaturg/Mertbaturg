<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="AI timeline: 2021 Rise; Nov 2022 ChatGPT; 2023 Techsy.io; Jul 2024 Claude; Jul 2025 Claude Code; Dec 2025 Agent fleets; May 2026 Codex; Oct 2026 121B tokens">
