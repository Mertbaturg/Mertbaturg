  <text x="384.0" y="240" class="t" font-size="14" fill="#a8b3c4" text-anchor="middle">co-founder &amp; CTO</text>
  <circle cx="528.0" cy="182" r="6" fill="#0d1424" stroke="#7dd3fc" stroke-width="2"/>
  <text x="528.0" y="160" class="m" font-size="14" fill="#7dd3fc" text-anchor="middle">Jul 2024</text>
