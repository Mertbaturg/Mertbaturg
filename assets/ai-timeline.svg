  <text x="816.0" y="160" class="m" font-size="14" fill="#7dd3fc" text-anchor="middle">Dec 2025</text>
  <text x="816.0" y="218" class="t" font-size="17" font-weight="700" fill="#f0f6fc" text-anchor="middle">Agent fleets</text>
