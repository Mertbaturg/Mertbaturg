  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0" stop-color="#f0f6fc"/><stop offset=".55" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#3987e5" opacity=".35"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3987e5" stroke-width="3"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="270" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="269" rx="19.5" fill="none" stroke="#1e293b"/>
  <text x="48" y="56" class="m" font-size="15" letter-spacing="3" fill="#7dd3fc">AI TIMELINE</text>
  <text x="48" y="96" class="t" font-size="32" font-weight="700" fill="#f0f6fc">Early, and never stopped</text>
